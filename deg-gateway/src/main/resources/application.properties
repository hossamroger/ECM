# ---------------------------------------------------------------------------
# DEG gateway configuration
# Values mirror the OSB ShjSocialDeptServices staging setup. Override per
# environment; keep secrets (deg.s-token) out of source control by supplying
# them via environment variables, e.g. DEG_S_TOKEN.
# ---------------------------------------------------------------------------

server.servlet.context-path=/online/shjsocialdeptservices

# --- Token service (step 2) ---
deg.token-base-url=https://stg-ds.sharjah.ae/socialdeptservices/api
deg.token-path=/social-dept/token
# Static credential OSB sent to the token service as the s_token header.
# Supply via env var; do NOT commit the real value.
deg.s-token=${DEG_S_TOKEN:}

# --- Backend DEG API (step 3) ---
deg.backend-base-url=http://stg-sssd-api.shj.ae/api/deg

# --- User validation (step 1) ---
deg.validation.enabled=true
# Full URL of the validateUser service (SecuritySBusProject/validateUserService).
# Left blank here because it lives in another OSB project; set per environment.
deg.validation.url=${DEG_VALIDATE_URL:}
deg.validation.dscode=SS-004

# --- Token cache (OSB result-caching equivalent) ---
deg.token-cache.enabled=true
deg.token-cache.ttl-seconds=300

# --- aid-request DB lookup (step 2b) ---
deg.aid-request.path=/aid-request
deg.aid-request.inbound-param=requestNo
deg.aid-request.outbound-param=RequestNo

# Datasource for /deg/aid-request only. Pick ONE mode (or neither):
#
# (A) App-server deploy (WebLogic/Tomcat): JNDI name.
#     NOTE: JNDI only resolves inside a container. Leave this BLANK for local runs,
#     otherwise you get NoInitialContextException.
deg.datasource.jndi-name=${DEG_DS_JNDI:}
#
# (B) Local / standalone: direct JDBC (used only when jndi-name is blank).
#deg.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
#deg.datasource.username=deg
#deg.datasource.password=changeit
#deg.datasource.driver-class-name=oracle.jdbc.OracleDriver
#
# (C) Neither set: app boots fine; aid-request returns without the DB lookup.

# --- Outbound HTTP timeouts (ms) ---
deg.http.connect-timeout-ms=10000
deg.http.read-timeout-ms=30000

# --- Actuator (standalone health/readiness) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
